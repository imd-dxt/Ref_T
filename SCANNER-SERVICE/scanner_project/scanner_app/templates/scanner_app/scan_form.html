{% extends 'scanner_app/base.html' %}

{% block title %}Submit New Scan{% endblock %}

{% block content %}
<div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
    <h2 class="text-2xl font-bold mb-6">Submit New Scan</h2>
    <form method="post" action="{% url 'submit-scan' %}">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="target_url">
                Target URL
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                   id="target_url" type="url" name="target_url" required
                   placeholder="https://example.com">
        </div>
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                type="submit">
            Start Scan
        </button>
    </form>
</div>
{% endblock %}
